<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bipador Inteligente</title>
<link rel="icon" href="https://app.grupobhds.com/jtexpress/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  :root {
    --md-sys-color-primary: #B3261E;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #F9DEDC;
    --md-sys-color-on-primary-container: #410E0B;
    --md-sys-color-background: #FFFBFE;
    --md-sys-color-on-background: #1C1B1F;
    --md-sys-color-surface: #FFFBFE;
    --md-sys-color-on-surface: #1C1B1F;
    --md-sys-color-surface-variant: #E7E0EC;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-outline: #79747E;
    --md-sys-color-success: #146C2E;
    --md-sys-color-success-container: #A7F0B7;
    --md-sys-color-on-success-container: #00210A;
    --md-sys-color-warning: #7D5260;
    --md-sys-color-warning-container: #FFD8E4;
    --md-sys-color-on-warning-container: #31111D;
    
    --md-sys-shape-corner-extra-large: 28px;
    --md-sys-shape-corner-large: 16px;
    --md-sys-shape-corner-medium: 12px;
    --md-sys-shape-corner-full: 100px;
    
    --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
    --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
  }
  
  body {
    font-family: 'Roboto', sans-serif;
    background-color: var(--md-sys-color-background);
    color: var(--md-sys-color-on-background);
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  
  header {
    background-color: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--md-elevation-1);
    flex-wrap: wrap;
    gap: 16px;
    z-index: 10;
  }
  
  .logo-container {
    display: flex;
    align-items: center;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.5px;
  }

  .logo-container img {
    height: 36px;
    margin-right: 12px;
    border-radius: 4px;
  }

  .nav-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .nav-btn {
    background-color: transparent;
    color: var(--md-sys-color-on-primary-container);
    border: none;
    padding: 10px 24px;
    border-radius: var(--md-sys-shape-corner-full);
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s;
  }
  
  .nav-btn:hover {
    background-color: rgba(65, 14, 11, 0.08);
  }
  
  .nav-btn.active {
    background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
  }

  .container {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 16px;
    width: 100%;
    box-sizing: border-box;
    flex-grow: 1;
  }

  h2 {
    font-size: 32px;
    font-weight: 400;
    margin-bottom: 24px;
    color: var(--md-sys-color-on-background);
  }
  
  .card {
    background: var(--md-sys-color-surface);
    border-radius: var(--md-sys-shape-corner-extra-large);
    padding: 32px;
    box-shadow: var(--md-elevation-2);
    margin-bottom: 24px;
  }
  
  .hidden {
    display: none !important;
  }
  
  .input-field {
    display: flex;
    flex-direction: column;
    margin-bottom: 24px;
  }

  .input-field label {
    font-size: 14px;
    margin-bottom: 8px;
    color: var(--md-sys-color-on-surface-variant);
    font-weight: 500;
  }

  input[type="text"], input[type="password"], select {
    width: 100%;
    padding: 16px;
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-medium);
    background-color: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    box-sizing: border-box;
    font-size: 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 0 0 1px var(--md-sys-color-primary);
  }
  
  .btn-primary {
    background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    border: none;
    padding: 12px 24px;
    border-radius: var(--md-sys-shape-corner-full);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.2s, box-shadow 0.2s;
    box-shadow: var(--md-elevation-1);
  }

  .btn-primary:hover {
    background-color: #9A1F18;
    box-shadow: var(--md-elevation-2);
  }

  .btn-primary:disabled {
    background-color: rgba(28, 27, 31, 0.12);
    color: rgba(28, 27, 31, 0.38);
    box-shadow: none;
    cursor: not-allowed;
  }

  .btn-secondary {
    background-color: transparent;
    color: var(--md-sys-color-primary);
    border: 1px solid var(--md-sys-color-outline);
    padding: 12px 24px;
    border-radius: var(--md-sys-shape-corner-full);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-secondary:hover {
    background-color: rgba(179, 38, 30, 0.08);
  }
  
  .grupo-container {
    margin-bottom: 32px;
    border-radius: var(--md-sys-shape-corner-extra-large);
    background: var(--md-sys-color-surface-variant);
    overflow: hidden;
    transition: all 0.3s ease;
  }
  
  .grupo-header {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    padding: 20px 24px;
    font-weight: 500;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .grupo-header:hover {
    background: #f0c3c1;
  }

  .expand-icon {
    margin-left: auto;
    transition: transform 0.3s ease;
  }

  .grupo-container.expanded .expand-icon {
    transform: rotate(180deg);
  }

  .grupo-body {
    display: none;
  }

  .grupo-container.expanded .grupo-body {
    display: block;
  }
  
  .num-secao {
    padding: 20px 24px;
    background: var(--md-sys-color-surface);
    margin: 8px;
    border-radius: var(--md-sys-shape-corner-large);
  }
  
  .num-title {
    font-weight: 500;
    font-size: 18px;
    color: var(--md-sys-color-primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .lote-linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background-color: var(--md-sys-color-background);
    margin-bottom: 8px;
    border-radius: var(--md-sys-shape-corner-medium);
    border: 1px solid var(--md-sys-color-surface-variant);
    transition: background-color 0.2s;
  }
  
  .lote-linha:hover {
    background-color: var(--md-sys-color-surface-variant);
  }
  
  .lote-codigo {
    font-family: 'Roboto Mono', monospace;
    font-size: 16px;
    cursor: pointer;
    flex-grow: 1;
    color: var(--md-sys-color-on-surface);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lote-codigo .material-symbols-outlined {
    font-size: 20px;
    color: var(--md-sys-color-outline);
  }
  
  .actions-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-status {
    width: auto;
    margin: 0;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: var(--md-sys-shape-corner-full);
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .status-novo {
    background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
  }
  
  .status-usado {
    background-color: var(--md-sys-color-success-container);
    color: var(--md-sys-color-on-success-container);
  }
  
  .status-incompleto {
    background-color: var(--md-sys-color-warning-container);
    color: var(--md-sys-color-on-warning-container);
  }

  .btn-delete {
    background: transparent;
    border: none;
    color: var(--md-sys-color-outline);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border-radius: 50%;
    transition: background-color 0.2s, color 0.2s;
  }

  .btn-delete:hover {
    background-color: var(--md-sys-color-warning-container);
    color: var(--md-sys-color-primary);
  }

  #modal-pin, #modal-novo-num {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 16px;
    box-sizing: border-box;
  }

  .modal-content {
    background: var(--md-sys-color-surface);
    padding: 32px;
    border-radius: var(--md-sys-shape-corner-extra-large);
    width: 100%;
    max-width: 400px;
    box-shadow: var(--md-elevation-2);
  }

  .modal-content h3 {
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 24px;
    font-weight: 400;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 32px;
  }

  .radio-group {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
    background: var(--md-sys-color-surface-variant);
    padding: 16px;
    border-radius: var(--md-sys-shape-corner-large);
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    cursor: pointer;
  }
  
  .radio-group input[type="radio"] {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--md-sys-color-primary);
  }

  #lista-bipagem {
    max-height: 240px;
    overflow-y: auto;
    background: var(--md-sys-color-surface-variant);
    border-radius: var(--md-sys-shape-corner-medium);
    padding: 16px;
    margin-bottom: 24px;
  }

  #lista-bipagem p {
    margin: 8px 0;
    padding: 12px;
    background: var(--md-sys-color-surface);
    border-radius: var(--md-sys-shape-corner-medium);
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  #camera-container {
    margin-bottom: 24px;
    border-radius: var(--md-sys-shape-corner-large);
    overflow: hidden;
    background: var(--md-sys-color-surface-variant);
    padding: 16px;
  }

  .admin-buttons {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  @media (min-width: 600px) {
    .admin-buttons {
      grid-template-columns: 1fr 1fr;
    }
    
    #btn-guardar-grupo {
      grid-column: 1 / -1;
    }
  }

  #btn-abrir-camera {
    background-color: var(--md-sys-color-on-surface-variant);
    color: var(--md-sys-color-surface);
  }

  #btn-abrir-camera:hover {
    background-color: #302d36;
  }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="https://app.grupobhds.com/jtexpress/logo.png" alt="Logo J&T Express">
    <span>Bipador Inteligente</span>
  </div>
  <div class="nav-group">
    <button class="nav-btn active" id="btn-nav-lotes">
      <span class="material-symbols-outlined">list_alt</span>
      Lote de Bipagem
    </button>
    <button class="nav-btn" id="btn-nav-admin">
      <span class="material-symbols-outlined">add_circle</span>
      Adicionar Lote
    </button>
  </div>
</header>

<div id="view-lotes" class="container">
  <h2>Lotes Disponíveis</h2>
  <div id="lotes-container"></div>
</div>

<div id="view-admin" class="container hidden">
  <h2>Adicionar Novo Lote</h2>
  <div class="card">
    <div class="radio-group">
      <label><input type="radio" name="tipo-grupo" value="novo" checked> Novo Grupo</label>
      <label><input type="radio" name="tipo-grupo" value="existente"> Usar Existente</label>
    </div>

    <div class="input-field" id="div-nome-grupo">
      <label>Nome do Grupo (Ex: SJS, Lote 26/08)</label>
      <input type="text" id="input-nome-grupo" placeholder="Digite o nome do grupo">
    </div>

    <div class="input-field hidden" id="div-select-grupo">
      <label>Selecione o Grupo</label>
      <select id="select-grupo"></select>
    </div>

    <div class="input-field">
      <label>Numeração</label>
      <select id="select-numeracao">
        <option value="410">410</option>
        <option value="304-03">304-03</option>
        <option value="286">286</option>
        <option value="287">287</option>
        <option value="311">311</option>
        <option value="307">307</option>
        <option value="304">304</option>
        <option value="365">365</option>
        <option value="318">318</option>
        <option value="340">340</option>
        <option value="336">336</option>
        <option value="304 (Apucarana)">304 (Apucarana)</option>
        <option value="NOVO">Adicionar Novo...</option>
      </select>
    </div>

    <div class="input-field">
      <label>Bipar Código de Barras</label>
      <input type="text" id="input-bipagem" placeholder="Posicione o cursor aqui e bipe" autocomplete="off">
    </div>

    <div class="admin-buttons">
      <button class="btn-primary" id="btn-abrir-camera">
        <span class="material-symbols-outlined">qr_code_scanner</span>
        Escanear com Câmera
      </button>
      <button class="btn-primary" id="btn-guardar-grupo">
        <span class="material-symbols-outlined">save</span>
        Guardar Grupo
      </button>
    </div>

    <div id="camera-container" class="hidden">
      <div id="reader" style="width: 100%;"></div>
      <button id="btn-fechar-camera" class="btn-secondary" style="width: 100%; margin-top: 16px;">
        <span class="material-symbols-outlined">close</span>
        Fechar Câmera
      </button>
    </div>

    <div id="lista-bipagem" style="margin-top: 24px;"></div>
  </div>
</div>

<div id="modal-pin" class="hidden">
  <div class="modal-content">
    <h3>Acesso Administrativo</h3>
    <div class="input-field">
      <label>PIN de Acesso</label>
      <input type="password" id="input-pin" placeholder="Digite o PIN">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancelar-pin">Cancelar</button>
      <button class="btn-primary" id="btn-confirmar-pin">Confirmar</button>
    </div>
  </div>
</div>

<div id="modal-novo-num" class="hidden">
  <div class="modal-content">
    <h3>Nova Numeração</h3>
    <div class="input-field">
      <label>Código da Numeração</label>
      <input type="text" id="input-novo-num" placeholder="Digite a numeração">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancelar-num">Cancelar</button>
      <button class="btn-primary" id="btn-salvar-num">Adicionar</button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "bipageminteligente.jtexpress.grupobhds.com";
  let adminPinValido = "";
  let lotesSessao = [];
  let gruposExistentes = [];
  let html5QrcodeScanner = null;
  let grupoExpandido = null;
  const statusOverrides = {};

  const viewLotes = document.getElementById("view-lotes");
  const viewAdmin = document.getElementById("view-admin");
  const modalPin = document.getElementById("modal-pin");
  const lotesContainer = document.getElementById("lotes-container");
  const btnNavLotes = document.getElementById("btn-nav-lotes");
  const btnNavAdmin = document.getElementById("btn-nav-admin");
  
  btnNavLotes.addEventListener("click", () => {
    viewLotes.classList.remove("hidden");
    viewAdmin.classList.add("hidden");
    btnNavLotes.classList.add("active");
    btnNavAdmin.classList.remove("active");
    fecharCamera();
    carregarDados();
  });

  btnNavAdmin.addEventListener("click", () => {
    if (!adminPinValido) {
      modalPin.classList.remove("hidden");
      document.getElementById("input-pin").focus();
    } else {
      abrirAdmin();
    }
  });

  document.getElementById("btn-cancelar-pin").addEventListener("click", () => {
    modalPin.classList.add("hidden");
    document.getElementById("input-pin").value = "";
  });

  document.getElementById("btn-confirmar-pin").addEventListener("click", () => {
    adminPinValido = document.getElementById("input-pin").value;
    modalPin.classList.add("hidden");
    document.getElementById("input-pin").value = "";
    abrirAdmin();
  });

  document.querySelectorAll('input[name="tipo-grupo"]').forEach(radio => {
    radio.addEventListener("change", (e) => {
      if (e.target.value === "novo") {
        document.getElementById("div-nome-grupo").classList.remove("hidden");
        document.getElementById("div-select-grupo").classList.add("hidden");
      } else {
        document.getElementById("div-nome-grupo").classList.add("hidden");
        document.getElementById("div-select-grupo").classList.remove("hidden");
        atualizarDropdownGrupos();
      }
    });
  });

  document.getElementById("select-numeracao").addEventListener("change", (e) => {
    if (e.target.value === "NOVO") {
      document.getElementById("modal-novo-num").classList.remove("hidden");
      document.getElementById("input-novo-num").focus();
    }
    document.getElementById("input-bipagem").focus();
  });

  document.getElementById("btn-salvar-num").addEventListener("click", () => {
    const num = document.getElementById("input-novo-num").value.trim();
    if (num) {
      const select = document.getElementById("select-numeracao");
      const option = document.createElement("option");
      option.value = num;
      option.text = num;
      select.insertBefore(option, select.lastElementChild);
      select.value = num;
    }
    document.getElementById("modal-novo-num").classList.add("hidden");
    document.getElementById("input-novo-num").value = "";
    document.getElementById("input-bipagem").focus();
  });

  document.getElementById("btn-cancelar-num").addEventListener("click", () => {
    document.getElementById("modal-novo-num").classList.add("hidden");
    document.getElementById("select-numeracao").selectedIndex = 0;
  });

  document.getElementById("input-bipagem").addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const barcode = e.target.value.trim();
      const numeracao = document.getElementById("select-numeracao").value;
      const ehNovoGrupo = document.querySelector('input[name="tipo-grupo"]:checked').value === "novo";
      const grupo = ehNovoGrupo ? document.getElementById("input-nome-grupo").value.trim() : document.getElementById("select-grupo").value;
      
      if (!barcode || !grupo || numeracao === "NOVO") return;
      
      const duplicado = lotesSessao.some(l => l.barcode === barcode);
      if (!duplicado) {
        lotesSessao.push({ grupo, numeracao, barcode });
        atualizarListaBipagem();
      }
      e.target.value = "";
    }
  });

  document.getElementById("btn-abrir-camera").addEventListener("click", () => {
    document.getElementById("camera-container").classList.remove("hidden");
    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: {width: 250, height: 150} },
        false
      );
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }
  });

  document.getElementById("btn-fechar-camera").addEventListener("click", fecharCamera);

  function fecharCamera() {
    document.getElementById("camera-container").classList.add("hidden");
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    const input = document.getElementById("input-bipagem");
    input.value = decodedText;
    const event = new KeyboardEvent("keypress", { key: "Enter" });
    input.dispatchEvent(event);
  }

  function onScanFailure(error) {
  }

  function removerLoteSessao(index) {
    lotesSessao.splice(index, 1);
    atualizarListaBipagem();
    document.getElementById("input-bipagem").focus();
  }

  function atualizarListaBipagem() {
    const div = document.getElementById("lista-bipagem");
    div.innerHTML = "";
    lotesSessao.slice().reverse().forEach((l, indexReverso) => {
      const indexReal = lotesSessao.length - 1 - indexReverso;
      const p = document.createElement("p");
      p.innerHTML = `<span style="display:flex; align-items:center; gap:8px;"><span class="material-symbols-outlined">barcode</span> ${l.numeracao} - ${l.barcode}</span>
                     <button class="btn-delete" onclick="removerLoteSessao(${indexReal})"><span class="material-symbols-outlined">close</span></button>`;
      div.appendChild(p);
    });
  }

  document.getElementById("btn-guardar-grupo").addEventListener("click", async () => {
    if (lotesSessao.length === 0) return;
    document.getElementById("btn-guardar-grupo").disabled = true;
    
    try {
      const resp = await fetch(WORKER_URL + "/api/salvar", {
        method: "POST",
        headers: { "x-admin-pin": adminPinValido },
        body: JSON.stringify({ acao: "salvar", lotes: lotesSessao })
      });
      
      if (resp.ok) {
        lotesSessao = [];
        atualizarListaBipagem();
        document.getElementById("input-nome-grupo").value = "";
        btnNavLotes.click();
      } else {
        alert("Erro de autenticacao ou falha no servidor.");
        adminPinValido = "";
        btnNavLotes.click();
      }
    } catch (e) {
      alert("Erro na conexao.");
    }
    document.getElementById("btn-guardar-grupo").disabled = false;
  });

  function abrirAdmin() {
    viewLotes.classList.add("hidden");
    viewAdmin.classList.remove("hidden");
    btnNavAdmin.classList.add("active");
    btnNavLotes.classList.remove("active");
    atualizarDropdownGrupos();
    document.getElementById("input-bipagem").focus();
  }

  function atualizarDropdownGrupos() {
    const select = document.getElementById("select-grupo");
    select.innerHTML = "";
    gruposExistentes.forEach(g => {
      const option = document.createElement("option");
      option.value = g;
      option.text = g;
      select.appendChild(option);
    });
  }

  async function carregarDados() {
    if (viewLotes.classList.contains("hidden")) return;
    try {
      const resp = await fetch(WORKER_URL + "/api/lotes");
      const dados = await resp.json();
      renderizarLotes(dados);
    } catch (e) {}
  }

  function renderizarLotes(dados) {
    const agrupado = {};
    const gruposSet = new Set();
    
    dados.forEach(d => {
      gruposSet.add(d.grupo);
      if (!agrupado[d.grupo]) agrupado[d.grupo] = {};
      if (!agrupado[d.grupo][d.numeracao]) agrupado[d.grupo][d.numeracao] = [];
      agrupado[d.grupo][d.numeracao].push(d);
    });
    
    gruposExistentes = Array.from(gruposSet);
    lotesContainer.innerHTML = "";
    
    for (const [grupo, numObj] of Object.entries(agrupado)) {
      const grupoDiv = document.createElement("div");
      grupoDiv.className = "grupo-container" + (grupoExpandido === grupo ? " expanded" : "");
      
      const grupoHeader = document.createElement("div");
      grupoHeader.className = "grupo-header";
      grupoHeader.innerHTML = `<span class="material-symbols-outlined">inventory_2</span> ${grupo} <span class="material-symbols-outlined expand-icon">expand_more</span>`;
      grupoHeader.onclick = () => {
        if (grupoExpandido === grupo) {
          grupoExpandido = null;
        } else {
          grupoExpandido = grupo;
        }
        carregarDados();
      };
      grupoDiv.appendChild(grupoHeader);
      
      const grupoBody = document.createElement("div");
      grupoBody.className = "grupo-body";

      for (const [numeracao, lotesArr] of Object.entries(numObj)) {
        const numSecao = document.createElement("div");
        numSecao.className = "num-secao";
        
        let lotesVisiveisCount = 0;
        
        const contentDiv = document.createElement("div");

        lotesArr.forEach(lote => {
          let statusAtual = lote.status;
          const chave = `${lote.barcode}-${lote.grupo}`;
          const override = statusOverrides[chave];
          
          if (override && (Date.now() - override.time < 10000)) {
            if (override.excluido) return;
            statusAtual = override.status;
          } else if (override) {
            delete statusOverrides[chave];
          }

          lotesVisiveisCount++;

          const linha = document.createElement("div");
          linha.className = "lote-linha";
          
          const codigo = document.createElement("span");
          codigo.className = "lote-codigo";
          codigo.innerHTML = `<span class="material-symbols-outlined">qr_code</span> ${lote.barcode}`;
          codigo.onclick = () => copiarBarcode(lote.barcode, lote.grupo, btnStatus);
          
          const actionsDiv = document.createElement("div");
          actionsDiv.className = "actions-container";

          const btnStatus = document.createElement("button");
          btnStatus.className = `btn-status status-${statusAtual.toLowerCase()}`;
          btnStatus.innerText = statusAtual;
          btnStatus.onclick = () => alterarStatusBotao(lote.barcode, lote.grupo, btnStatus);
          
          const btnExcluir = document.createElement("button");
          btnExcluir.className = "btn-delete";
          btnExcluir.innerHTML = '<span class="material-symbols-outlined">close</span>';
          btnExcluir.onclick = () => excluirLote(lote.barcode, lote.grupo);

          actionsDiv.appendChild(btnStatus);
          actionsDiv.appendChild(btnExcluir);

          linha.appendChild(codigo);
          linha.appendChild(actionsDiv);
          contentDiv.appendChild(linha);
        });
        
        if (lotesVisiveisCount > 0) {
          const numTitle = document.createElement("div");
          numTitle.className = "num-title";
          numTitle.innerHTML = `<span class="material-symbols-outlined">tag</span> Numeração: ${numeracao} (${lotesVisiveisCount} lotes)`;
          numSecao.appendChild(numTitle);
          numSecao.appendChild(contentDiv);
          grupoBody.appendChild(numSecao);
        }
      }
      
      if (grupoBody.children.length > 0) {
        grupoDiv.appendChild(grupoBody);
        lotesContainer.appendChild(grupoDiv);
      }
    }
  }

  function copiarBarcode(barcode, grupo, btnStatusElement) {
    navigator.clipboard.writeText(barcode);
    if (btnStatusElement.innerText === "Novo") {
      let novoStatus = "Usado";
      btnStatusElement.innerText = novoStatus;
      btnStatusElement.className = `btn-status status-${novoStatus.toLowerCase()}`;
      
      statusOverrides[`${barcode}-${grupo}`] = {
        status: novoStatus,
        time: Date.now()
      };
      
      atualizarStatusBackend(barcode, grupo, novoStatus);
    }
  }

  function alterarStatusBotao(barcode, grupo, btnStatusElement) {
    let currentStatus = btnStatusElement.innerText;
    let novoStatus = "";
    
    if (currentStatus === "Usado") {
      novoStatus = "Incompleto";
    } else if (currentStatus === "Incompleto") {
      novoStatus = "Novo";
    } else {
      return;
    }
    
    btnStatusElement.innerText = novoStatus;
    btnStatusElement.className = `btn-status status-${novoStatus.toLowerCase()}`;
    
    statusOverrides[`${barcode}-${grupo}`] = {
      status: novoStatus,
      time: Date.now()
    };
    
    atualizarStatusBackend(barcode, grupo, novoStatus);
  }

  async function atualizarStatusBackend(barcode, grupo, novoStatus) {
    try {
      await fetch(WORKER_URL + "/api/status", {
        method: "POST",
        body: JSON.stringify({ acao: "atualizarStatus", barcode: barcode, grupo: grupo, status: novoStatus })
      });
    } catch (e) {}
  }

  async function excluirLote(barcode, grupo) {
    if (!confirm(`Deseja excluir o código ${barcode}?`)) return;
    
    statusOverrides[`${barcode}-${grupo}`] = {
      excluido: true,
      time: Date.now()
    };
    
    carregarDados();
    
    try {
      await fetch(WORKER_URL + "/api/excluir", {
        method: "POST",
        body: JSON.stringify({ acao: "excluir", barcode: barcode, grupo: grupo })
      });
    } catch (e) {}
  }

  setInterval(carregarDados, 3000);
  carregarDados();
</script>

</body>
</html>
